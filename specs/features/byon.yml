# Feature: Bring Your Own Network (BYON)
# Applies to: create (immutable after creation)
# Depends on: private_network
apiVersion: capa-automation/v1
kind: ClusterAutomationSpec
metadata:
  name: byon
spec:
  action: create
  cluster: ''
  namespace: ns-rosa-hcp
  features:
    byon: true
    private_network: true
