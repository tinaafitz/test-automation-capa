---
# Pre-flight check: Verify OCM role exists and is linked to the AWS account.
# If missing, automatically creates and links it using boto3 + OCM API.
# This prevents the 45-minute CLUSTERS-MGMT-403 failure during provisioning.

- name: Check for OCM role in AWS IAM
  shell: |
    python3 -c "
    import json, sys
    try:
        import boto3
        iam = boto3.client('iam')
        paginator = iam.get_paginator('list_roles')
        for page in paginator.paginate():
            for role in page['Roles']:
                if 'OCM-Role' in role['RoleName']:
                    print(json.dumps({'exists': True, 'arn': role['Arn'], 'name': role['RoleName']}))
                    sys.exit(0)
        print(json.dumps({'exists': False}))
    except Exception as e:
        print(json.dumps({'exists': False, 'error': str(e)}))
    "
  register: ocm_role_check_result
  changed_when: false
  environment:
    AWS_ACCESS_KEY_ID: "{{ AWS_ACCESS_KEY_ID }}"
    AWS_SECRET_ACCESS_KEY: "{{ AWS_SECRET_ACCESS_KEY }}"
    AWS_DEFAULT_REGION: "{{ aws_region | default('us-west-2') }}"
    PATH: "{{ AUTOMATION_PATH | default(playbook_dir + '/..') }}/ui/backend/venv/bin:{{ ansible_env.PATH | default('/usr/bin:/bin:/usr/local/bin') }}"

- name: Parse OCM role check result
  set_fact:
    ocm_role_status: "{{ ocm_role_check_result.stdout | from_json }}"

- name: Check if boto3 is unavailable
  set_fact:
    boto3_unavailable: "{{ ocm_role_status.error is defined and 'No module named' in ocm_role_status.error }}"

- name: Verify OCM role is linked via ROSA CLI
  shell: |
    rosa list ocm-role 2>&1 | grep -v "^WARN" | grep -v "^$" | tail -n +2
  register: rosa_ocm_role_list
  changed_when: false
  failed_when: false

- name: Parse OCM role linked status
  set_fact:
    ocm_role_linked: "{{ 'Yes' in (rosa_ocm_role_list.stdout | default('')) }}"
    ocm_role_linked_arn: "{{ rosa_ocm_role_list.stdout | default('') | regex_search('arn:aws:iam::[0-9]+:role/[^\\s]+') | default('') }}"

- name: Display OCM role status
  debug:
    msg: >-
      {% if ocm_role_status.exists and ocm_role_linked | bool %}
      ✅ OCM role found and linked: {{ ocm_role_status.name }} ({{ ocm_role_status.arn }})
      {% elif ocm_role_status.exists and not (ocm_role_linked | bool) %}
      ⚠️ OCM role exists in AWS ({{ ocm_role_status.name }}) but is NOT linked in OCM — will attempt to link
      {% elif boto3_unavailable | bool %}
      ℹ️ OCM role check skipped — boto3 not available in system Python. The OCM role likely already exists; install boto3 or use the backend venv to verify.
      {% else %}
      ⚠️ No OCM role found in AWS IAM — will attempt to create one
      {% endif %}

- name: Link existing OCM role if unlinked
  shell: |
    rosa link ocm-role --role-arn "{{ ocm_role_status.arn }}" --yes 2>&1
  register: ocm_role_link_result
  when:
    - ocm_role_status.exists
    - not (ocm_role_linked | bool)
  failed_when: false

- name: Display OCM role link result
  debug:
    msg: "{{ ocm_role_link_result.stdout | default('') }}"
  when: ocm_role_link_result is defined and ocm_role_link_result.stdout is defined

- name: Unlink stale OCM role if linked role doesn't exist in AWS
  shell: |
    LINKED_ARN="{{ ocm_role_linked_arn }}"
    LINKED_NAME=$(echo "$LINKED_ARN" | sed -n 's|.*role/||p')
    if [ -n "$LINKED_NAME" ]; then
      aws iam get-role --role-name "$LINKED_NAME" >/dev/null 2>&1
      if [ $? -ne 0 ]; then
        echo "Stale linked role detected: $LINKED_ARN does not exist in AWS"
        rosa unlink ocm-role --role-arn "$LINKED_ARN" --yes 2>&1
        echo "STALE_ROLE_UNLINKED"
      else
        echo "Linked role $LINKED_NAME exists in AWS — OK"
      fi
    fi
  register: stale_role_check
  changed_when: "'STALE_ROLE_UNLINKED' in stale_role_check.stdout"
  failed_when: false
  when: ocm_role_linked | bool
  environment:
    AWS_ACCESS_KEY_ID: "{{ AWS_ACCESS_KEY_ID }}"
    AWS_SECRET_ACCESS_KEY: "{{ AWS_SECRET_ACCESS_KEY }}"
    AWS_DEFAULT_REGION: "{{ aws_region | default('us-west-2') }}"

- name: Link correct OCM role after stale unlink
  shell: |
    rosa link ocm-role --role-arn "{{ ocm_role_status.arn }}" --yes 2>&1
  when:
    - stale_role_check is defined
    - "'STALE_ROLE_UNLINKED' in (stale_role_check.stdout | default(''))"
    - ocm_role_status.exists
  failed_when: false

- name: Create and link OCM role if missing
  when: not ocm_role_status.exists and not (boto3_unavailable | bool)
  block:
    - name: Auto-create OCM role via OcmRoleManager
      shell: |
        python3 -c "
        import sys, os, logging
        logging.basicConfig(level=logging.INFO, format='%(levelname)s: %(message)s')
        sys.path.insert(0, '{{ playbook_dir }}/..')
        from agents.domains.rosa_hcp.ocm_role_manager import OcmRoleManager
        mgr = OcmRoleManager(
            ocm_client_id=os.environ.get('OCM_CLIENT_ID', ''),
            ocm_client_secret=os.environ.get('OCM_CLIENT_SECRET', ''),
            ocm_api_url=os.environ.get('OCM_API_URL', 'https://api.stage.openshift.com'),
            aws_account_id=os.environ.get('AWS_ACCOUNT_ID', ''),
        )
        success, msg = mgr.ensure_ocm_role()
        print(msg)
        sys.exit(0 if success else 1)
        "
      register: ocm_role_create_result
      environment:
        AWS_ACCESS_KEY_ID: "{{ AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ AWS_SECRET_ACCESS_KEY }}"
        AWS_DEFAULT_REGION: "{{ aws_region | default('us-west-2') }}"
        AWS_ACCOUNT_ID: "{{ aws_account_id | default('') }}"
        OCM_CLIENT_ID: "{{ OCM_CLIENT_ID | default('') }}"
        OCM_CLIENT_SECRET: "{{ OCM_CLIENT_SECRET | default('') }}"
        OCM_API_URL: "{{ OCM_API_URL | default('https://api.stage.openshift.com') }}"
        PATH: "{{ AUTOMATION_PATH | default(playbook_dir + '/..') }}/ui/backend/venv/bin:{{ ansible_env.PATH | default('/usr/bin:/bin:/usr/local/bin') }}"

    - name: Display OCM role creation result
      debug:
        msg: "{{ ocm_role_create_result.stdout }}"

    - name: Fail if OCM role creation failed
      fail:
        msg: |
          ❌ OCM role creation/linking failed.
          {{ ocm_role_create_result.stdout }}
          {{ ocm_role_create_result.stderr }}

          Manual fix: rosa create ocm-role --admin --mode auto --yes
      when: ocm_role_create_result.rc != 0
