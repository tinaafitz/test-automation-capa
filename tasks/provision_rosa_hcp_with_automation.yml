---
# ================================================================
# Provision ROSA HCP Cluster with Conditional Automation
# ================================================================
# This task orchestrates ROSA HCP cluster provisioning with optional
# automated creation of RosaRoleConfig and ROSANetwork resources.
#
# Variables:
#   - cluster_name: Name of the cluster to create (required)
#   - create_rosa_roles: Boolean to create RosaRoleConfig (default: false)
#   - create_rosa_network: Boolean to create ROSANetwork (default: false)
#   - rosa_role_prefix: Prefix for AWS role names (default: cluster_name)
#   - network_cidr: CIDR block for VPC (default: 10.0.0.0/16)
#   - availability_zones: List of AZs (default: auto-detected from region)
# ================================================================

- name: Set default value for cluster_name
  set_fact:
    cluster_name: "test-cluster"
  when: cluster_name is not defined

- name: Set sidecar log file for real-time agent monitoring
  set_fact:
    agent_sidecar_log: "/tmp/provision-agent-{{ cluster_name }}.log"

- name: Initialize sidecar log file
  copy:
    content: ""
    dest: "{{ agent_sidecar_log }}"
    force: true

- name: Set default value for rosa_role_prefix
  set_fact:
    rosa_role_prefix: "{{ cluster_name }}"
  when: rosa_role_prefix is not defined

- name: Set default value for rosa_role_config_name
  set_fact:
    rosa_role_config_name: "{{ cluster_name }}-roles"
  when: rosa_role_config_name is not defined

- name: Set default value for rosa_network_name
  set_fact:
    rosa_network_name: "{{ cluster_name }}-network"
  when: rosa_network_name is not defined

- name: Set default value for network_cidr
  set_fact:
    network_cidr: "10.0.0.0/16"
  when: network_cidr is not defined

- name: Set default value for availability_zone_count
  set_fact:
    availability_zone_count: 1
  when: availability_zone_count is not defined

- name: Set default value for create_rosa_roles
  set_fact:
    create_rosa_roles: false
  when: create_rosa_roles is not defined

- name: Set default value for create_rosa_network
  set_fact:
    create_rosa_network: false
  when: create_rosa_network is not defined

- name: Ensure boolean types for flags
  set_fact:
    create_rosa_roles: "{{ create_rosa_roles | bool }}"
    create_rosa_network: "{{ create_rosa_network | bool }}"

- name: Set default value for aws_region
  set_fact:
    aws_region: "us-west-2"
  when: aws_region is not defined

- name: Set default value for openshift_version
  set_fact:
    openshift_version: "4.20.10"
  when: openshift_version is not defined

- name: Set default value for capi_namespace
  set_fact:
    capi_namespace: "ns-rosa-hcp"
  when: capi_namespace is not defined

- name: Display provisioning plan
  debug:
    msg: |
      ═══════════════════════════════════════════════════════════════
      🚀 ROSA HCP Cluster Provisioning Plan
      ═══════════════════════════════════════════════════════════════

      Cluster Name: {{ cluster_name }}
      Namespace: {{ capi_namespace }}
      AWS Region: {{ aws_region }}
      OpenShift Version: {{ openshift_version }}

      Automation Options:
      ├─ Create RosaRoleConfig: {{ '✓ Enabled' if (create_rosa_roles | bool) else '✗ Disabled' }}
      {% if create_rosa_roles | bool %}
      │  ├─ Role Config Name: {{ rosa_role_config_name }}
      │  └─ Role Prefix: {{ rosa_role_prefix }}
      {% endif %}
      │
      └─ Create ROSANetwork: {{ '✓ Enabled' if (create_rosa_network | bool) else '✗ Disabled' }}
      {% if create_rosa_network | bool %}
         ├─ Network Name: {{ rosa_network_name }}
         ├─ CIDR Block: {{ network_cidr }}
         └─ Availability Zones: {{ availability_zone_count }}
      {% endif %}

      ═══════════════════════════════════════════════════════════════

# ================================================================
# PRE-STEP: Check for stale CRs from previous cluster (resurrection bug)
# ================================================================
- name: Check for stale CAPA CRs in namespace
  shell: |
    CURRENT_CLUSTER="{{ cluster_name }}"
    STALE_CRS=""
    STALE_JSON="[]"
    for RESOURCE_TYPE in rosacontrolplane rosanetwork rosaroleconfig cluster.cluster.x-k8s.io rosamachinepool machinepool.cluster.x-k8s.io; do
      ITEMS=$(oc get ${RESOURCE_TYPE} -n {{ capi_namespace }} -o json 2>/dev/null | python3 -c "
    import sys, json
    data = json.load(sys.stdin)
    current = '${CURRENT_CLUSTER}'
    for item in data.get('items', []):
        name = item['metadata']['name']
        cluster_label = item['metadata'].get('labels', {}).get('cluster.x-k8s.io/cluster-name', '')
        if name.startswith(current) or cluster_label == current:
            continue
        dt = item['metadata'].get('deletionTimestamp', '')
        finalizers = item['metadata'].get('finalizers', [])
        rv = item['metadata'].get('resourceVersion', '')
        conditions = json.dumps(item.get('status', {}).get('conditions', []))
        print(json.dumps({'type': '${RESOURCE_TYPE}', 'name': name, 'deletionTimestamp': dt, 'finalizers': finalizers, 'resourceVersion': rv, 'conditions': conditions}))
    " 2>/dev/null)
      if [ -n "$ITEMS" ]; then
        while IFS= read -r line; do
          STALE_CRS="${STALE_CRS}${RESOURCE_TYPE}/$(echo "$line" | python3 -c "import sys,json;d=json.load(sys.stdin);print(f'{d[\"name\"]}|{d[\"deletionTimestamp\"]}|{\";\".join(d[\"finalizers\"])}')")\n"
          STALE_JSON=$(echo "$STALE_JSON" | python3 -c "import sys,json;arr=json.load(sys.stdin);arr.append($line);print(json.dumps(arr))")
        done <<< "$ITEMS"
      fi
    done
    if [ -n "$STALE_CRS" ]; then
      echo "STALE_CRS_FOUND"
      echo -e "$STALE_CRS"
    else
      echo "CLEAN"
    fi
  register: stale_cr_check
  changed_when: false

- name: Display stale CR warning
  debug:
    msg: |
      ╔═══════════════════════════════════════════════════════════════╗
      ║  WARNING: Stale CAPA CRs detected in {{ capi_namespace }}
      ╠═══════════════════════════════════════════════════════════════╣
      {{ stale_cr_check.stdout }}
      ║                                                               ║
      ║  These may cause the resurrection bug where a previously      ║
      ║  deleted cluster re-provisions its resources.                 ║
      ╚═══════════════════════════════════════════════════════════════╝
  when: "'STALE_CRS_FOUND' in stale_cr_check.stdout"

- name: Log stale CR detection for resurrection bug evidence
  shell: |
    LOGDIR="/tmp/capa-resurrection-evidence"
    mkdir -p "$LOGDIR"
    LOGFILE="$LOGDIR/stale-cr-$(date +%Y%m%d-%H%M%S).json"
    python3 -c "
    import json, datetime
    record = {
        'timestamp': datetime.datetime.utcnow().isoformat() + 'Z',
        'event': 'stale_crs_detected_pre_provision',
        'target_cluster': '{{ cluster_name }}',
        'namespace': '{{ capi_namespace }}',
        'raw_output': '''{{ stale_cr_check.stdout }}''',
    }
    print(json.dumps(record, indent=2))
    " > "$LOGFILE"
    echo "Evidence logged to $LOGFILE"
  changed_when: false
  when: "'STALE_CRS_FOUND' in stale_cr_check.stdout"

- name: Check AWS for orphaned resources from stale CRs
  environment:
    AWS_ACCESS_KEY_ID: "{{ AWS_ACCESS_KEY_ID | default(omit) }}"
    AWS_SECRET_ACCESS_KEY: "{{ AWS_SECRET_ACCESS_KEY | default(omit) }}"
  shell: |
    CURRENT_CLUSTER="{{ cluster_name }}"
    REGION="{{ aws_region | default('us-west-2') }}"
    ORPHANS=""
    for CR_LINE in $(echo -e "{{ stale_cr_check.stdout }}" | grep '/' | awk -F'|' '{print $1}'); do
      RESOURCE_TYPE=$(echo "$CR_LINE" | cut -d'/' -f1)
      CR_NAME=$(echo "$CR_LINE" | cut -d'/' -f2)
      case "$CR_NAME" in "${CURRENT_CLUSTER}"*) continue ;; esac
      case "$RESOURCE_TYPE" in
        rosanetwork)
          STACK_PREFIX=$(echo "$CR_NAME" | sed 's/-network$//')
          STACK_NAME="${STACK_PREFIX}-rosa-network-stack"
          STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$REGION" --query 'Stacks[0].StackStatus' --output text 2>&1)
          if [ $? -eq 0 ] && [ "$STATUS" != "DELETE_COMPLETE" ]; then
            ORPHANS="${ORPHANS}CloudFormation stack ${STACK_NAME} (${STATUS})\n"
          fi
          ;;
        rosaroleconfig)
          ROLE_PREFIX=$(echo "$CR_NAME" | sed 's/-roles$//')
          for ROLE_SUFFIX in Installer-Role Support-Role Worker-Role; do
            ROLE_NAME="${ROLE_PREFIX}-${ROLE_SUFFIX}"
            aws iam get-role --role-name "$ROLE_NAME" >/dev/null 2>&1
            if [ $? -eq 0 ]; then
              ORPHANS="${ORPHANS}IAM role ${ROLE_NAME}\n"
            fi
          done
          OIDC_ARNS=$(aws iam list-open-id-connect-providers --query "OpenIDConnectProviderList[].Arn" --output text 2>/dev/null | tr '\t' '\n' | while read arn; do
            TAGS=$(aws iam get-open-id-connect-provider --open-id-connect-provider-arn "$arn" --query "Tags" --output json 2>/dev/null)
            if echo "$TAGS" | grep -q "$ROLE_PREFIX" 2>/dev/null; then
              echo "$arn"
            fi
          done)
          if [ -n "$OIDC_ARNS" ]; then
            ORPHANS="${ORPHANS}OIDC provider(s) for ${ROLE_PREFIX}: ${OIDC_ARNS}\n"
          fi
          ;;
      esac
    done
    if [ -n "$ORPHANS" ]; then
      echo "AWS_ORPHANS_FOUND"
      echo -e "$ORPHANS"
    else
      echo "NO_AWS_ORPHANS"
    fi
  register: aws_orphan_check
  changed_when: false
  failed_when: false
  when: "'STALE_CRS_FOUND' in stale_cr_check.stdout"

- name: Display AWS orphan warning
  debug:
    msg: |
      ╔═══════════════════════════════════════════════════════════════╗
      ║  WARNING: Orphaned AWS resources found from stale CRs
      ╠═══════════════════════════════════════════════════════════════╣
      {{ aws_orphan_check.stdout }}
      ╚═══════════════════════════════════════════════════════════════╝
  when:
    - "'STALE_CRS_FOUND' in stale_cr_check.stdout"
    - aws_orphan_check is defined
    - "'AWS_ORPHANS_FOUND' in aws_orphan_check.stdout"

- name: Clean up orphaned CloudFormation stacks before removing finalizers
  environment:
    AWS_ACCESS_KEY_ID: "{{ AWS_ACCESS_KEY_ID | default(omit) }}"
    AWS_SECRET_ACCESS_KEY: "{{ AWS_SECRET_ACCESS_KEY | default(omit) }}"
  shell: |
    CURRENT_CLUSTER="{{ cluster_name }}"
    REGION="{{ aws_region | default('us-west-2') }}"
    for CR_LINE in $(echo -e "{{ stale_cr_check.stdout }}" | grep 'rosanetwork/' | awk -F'|' '{print $1}'); do
      CR_NAME=$(echo "$CR_LINE" | cut -d'/' -f2)
      case "$CR_NAME" in "${CURRENT_CLUSTER}"*) echo "Skipping current cluster resource $CR_NAME"; continue ;; esac
      STACK_PREFIX=$(echo "$CR_NAME" | sed 's/-network$//')
      STACK_NAME="${STACK_PREFIX}-rosa-network-stack"
      STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$REGION" --query 'Stacks[0].StackStatus' --output text 2>&1)
      if [ $? -ne 0 ]; then
        echo "Stack $STACK_NAME does not exist — safe to proceed"
        continue
      fi
      if [ "$STATUS" = "DELETE_COMPLETE" ]; then
        echo "Stack $STACK_NAME already deleted"
        continue
      fi
      if [ "$STATUS" = "DELETE_FAILED" ]; then
        echo "Stack $STACK_NAME in DELETE_FAILED — cleaning orphaned resources"
        VPC_ID=$(aws cloudformation describe-stack-resources --stack-name "$STACK_NAME" --region "$REGION" --query "StackResources[?ResourceType=='AWS::EC2::VPC'].PhysicalResourceId" --output text 2>/dev/null)
        if [ -n "$VPC_ID" ] && [ "$VPC_ID" != "None" ]; then
          for SG_ID in $(aws ec2 describe-security-groups --filters "Name=vpc-id,Values=$VPC_ID" --region "$REGION" --query "SecurityGroups[?GroupName!='default'].GroupId" --output text 2>/dev/null); do
            echo "Deleting orphaned security group $SG_ID"
            aws ec2 delete-security-group --group-id "$SG_ID" --region "$REGION" 2>/dev/null || true
          done
          for ENI_ID in $(aws ec2 describe-network-interfaces --filters "Name=vpc-id,Values=$VPC_ID" --region "$REGION" --query "NetworkInterfaces[].NetworkInterfaceId" --output text 2>/dev/null); do
            ATTACH_ID=$(aws ec2 describe-network-interfaces --network-interface-ids "$ENI_ID" --region "$REGION" --query "NetworkInterfaces[0].Attachment.AttachmentId" --output text 2>/dev/null)
            if [ -n "$ATTACH_ID" ] && [ "$ATTACH_ID" != "None" ]; then
              aws ec2 detach-network-interface --attachment-id "$ATTACH_ID" --force --region "$REGION" 2>/dev/null || true
              sleep 2
            fi
            echo "Deleting orphaned ENI $ENI_ID"
            aws ec2 delete-network-interface --network-interface-id "$ENI_ID" --region "$REGION" 2>/dev/null || true
          done
          for EP_ID in $(aws ec2 describe-vpc-endpoints --filters "Name=vpc-id,Values=$VPC_ID" --region "$REGION" --query "VpcEndpoints[].VpcEndpointId" --output text 2>/dev/null); do
            echo "Deleting orphaned VPC endpoint $EP_ID"
            aws ec2 delete-vpc-endpoints --vpc-endpoint-ids "$EP_ID" --region "$REGION" 2>/dev/null || true
          done
        fi
        echo "Retrying stack deletion for $STACK_NAME"
        aws cloudformation delete-stack --stack-name "$STACK_NAME" --region "$REGION" 2>/dev/null || true
      elif [ "$STATUS" != "DELETE_IN_PROGRESS" ]; then
        echo "Initiating deletion of stack $STACK_NAME (status: $STATUS)"
        aws cloudformation delete-stack --stack-name "$STACK_NAME" --region "$REGION" 2>/dev/null || true
      else
        echo "Stack $STACK_NAME already DELETE_IN_PROGRESS"
      fi
    done
  register: cfn_cleanup
  changed_when: "'Deleting' in cfn_cleanup.stdout or 'Retrying' in cfn_cleanup.stdout or 'Initiating' in cfn_cleanup.stdout"
  failed_when: false
  when:
    - "'STALE_CRS_FOUND' in stale_cr_check.stdout"
    - aws_orphan_check is defined
    - "'AWS_ORPHANS_FOUND' in aws_orphan_check.stdout"

- name: Clean up orphaned IAM roles and OIDC providers from stale ROSARoleConfig
  environment:
    AWS_ACCESS_KEY_ID: "{{ AWS_ACCESS_KEY_ID | default(omit) }}"
    AWS_SECRET_ACCESS_KEY: "{{ AWS_SECRET_ACCESS_KEY | default(omit) }}"
  shell: |
    delete_iam_role() {
      ROLE_NAME="$1"
      if ! aws iam get-role --role-name "$ROLE_NAME" >/dev/null 2>&1; then
        return 0
      fi
      echo "Cleaning orphaned IAM role $ROLE_NAME"
      for POLICY_ARN in $(aws iam list-attached-role-policies --role-name "$ROLE_NAME" --query "AttachedPolicies[].PolicyArn" --output text 2>/dev/null); do
        echo "  Detaching policy $POLICY_ARN"
        aws iam detach-role-policy --role-name "$ROLE_NAME" --policy-arn "$POLICY_ARN" 2>/dev/null || true
      done
      for POLICY_NAME in $(aws iam list-role-policies --role-name "$ROLE_NAME" --query "PolicyNames[]" --output text 2>/dev/null); do
        echo "  Deleting inline policy $POLICY_NAME"
        aws iam delete-role-policy --role-name "$ROLE_NAME" --policy-name "$POLICY_NAME" 2>/dev/null || true
      done
      for PROFILE in $(aws iam list-instance-profiles-for-role --role-name "$ROLE_NAME" --query "InstanceProfiles[].InstanceProfileName" --output text 2>/dev/null); do
        aws iam remove-role-from-instance-profile --role-name "$ROLE_NAME" --instance-profile-name "$PROFILE" 2>/dev/null || true
      done
      aws iam delete-role --role-name "$ROLE_NAME" 2>/dev/null && echo "  Deleted role $ROLE_NAME" || echo "  WARNING: Could not delete role $ROLE_NAME"
    }

    CURRENT_CLUSTER="{{ cluster_name }}"
    for CR_LINE in $(echo -e "{{ stale_cr_check.stdout }}" | grep 'rosaroleconfig/' | awk -F'|' '{print $1}'); do
      CR_NAME=$(echo "$CR_LINE" | cut -d'/' -f2)
      case "$CR_NAME" in "${CURRENT_CLUSTER}"*) echo "Skipping current cluster resource $CR_NAME"; continue ;; esac
      ROLE_PREFIX=$(echo "$CR_NAME" | sed 's/-roles$//')

      for ROLE_SUFFIX in Installer-Role Support-Role Worker-Role; do
        delete_iam_role "${ROLE_PREFIX}-${ROLE_SUFFIX}"
      done

      OPERATOR_SUFFIXES="openshift-cloud-network-config-controller-cloud-credentials openshift-machine-api-aws-cloud-credentials openshift-cloud-credential-operator-cloud-credential-operator-iam-ro openshift-image-registry-installer-cloud-credentials openshift-ingress-operator-cloud-credentials openshift-cluster-csi-drivers-ebs-cloud-credentials kube-system-kube-controller-manager kube-system-capa-controller-manager kube-system-control-plane-operator"
      for OP_SUFFIX in $OPERATOR_SUFFIXES; do
        delete_iam_role "${ROLE_PREFIX}-${OP_SUFFIX}"
      done

      OIDC_DELETED=0
      for OIDC_ARN in $(aws iam list-open-id-connect-providers --query "OpenIDConnectProviderList[].Arn" --output text 2>/dev/null); do
        TAGS=$(aws iam get-open-id-connect-provider --open-id-connect-provider-arn "$OIDC_ARN" --output json 2>/dev/null)
        if echo "$TAGS" | python3 -c "
    import sys, json
    data = json.load(sys.stdin)
    tags = {t['Key']: t['Value'] for t in data.get('Tags', [])}
    url = data.get('Url', '')
    if '${ROLE_PREFIX}' in tags.get('rosa_cluster_name', '') or '${ROLE_PREFIX}' in tags.get('Name', '') or '${ROLE_PREFIX}' in url:
        sys.exit(0)
    sys.exit(1)
    " 2>/dev/null; then
          echo "Deleting orphaned OIDC provider $OIDC_ARN (prefix: $ROLE_PREFIX)"
          aws iam delete-open-id-connect-provider --open-id-connect-provider-arn "$OIDC_ARN" 2>/dev/null && echo "  Deleted OIDC provider" || echo "  WARNING: Could not delete OIDC provider"
          OIDC_DELETED=$((OIDC_DELETED + 1))
        fi
      done
      if [ "$OIDC_DELETED" -eq 0 ]; then
        echo "No orphaned OIDC providers found for prefix $ROLE_PREFIX"
      fi

      ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text 2>/dev/null)
      if [ -n "$ACCOUNT_ID" ]; then
        for POLICY_SUFFIX in Installer-Role-Policy Support-Role-Policy Worker-Role-Policy; do
          POLICY_ARN="arn:aws:iam::${ACCOUNT_ID}:policy/${ROLE_PREFIX}-${POLICY_SUFFIX}"
          if aws iam get-policy --policy-arn "$POLICY_ARN" >/dev/null 2>&1; then
            for VERSION in $(aws iam list-policy-versions --policy-arn "$POLICY_ARN" --query "Versions[?!IsDefaultVersion].VersionId" --output text 2>/dev/null); do
              aws iam delete-policy-version --policy-arn "$POLICY_ARN" --version-id "$VERSION" 2>/dev/null || true
            done
            echo "Deleting orphaned IAM policy $POLICY_ARN"
            aws iam delete-policy --policy-arn "$POLICY_ARN" 2>/dev/null || echo "  WARNING: Could not delete policy"
          fi
        done
      fi
    done
  register: iam_oidc_cleanup
  changed_when: "'Deleted' in iam_oidc_cleanup.stdout"
  failed_when: false
  when:
    - "'STALE_CRS_FOUND' in stale_cr_check.stdout"
    - aws_orphan_check is defined
    - "'AWS_ORPHANS_FOUND' in aws_orphan_check.stdout"

- name: Display IAM/OIDC cleanup result
  debug:
    msg: "{{ iam_oidc_cleanup.stdout }}"
  when:
    - iam_oidc_cleanup is defined
    - iam_oidc_cleanup.stdout | default('') | length > 0

- name: Remove stale CRs with stuck finalizers
  shell: |
    CURRENT_CLUSTER="{{ cluster_name }}"
    for RESOURCE_TYPE in rosamachinepool machinepool.cluster.x-k8s.io rosacontrolplane cluster.cluster.x-k8s.io rosanetwork rosaroleconfig; do
      for CR_NAME in $(oc get ${RESOURCE_TYPE} -n {{ capi_namespace }} -o json 2>/dev/null | python3 -c "
    import sys, json
    data = json.load(sys.stdin)
    current = '${CURRENT_CLUSTER}'
    for item in data.get('items', []):
        name = item['metadata']['name']
        cluster_label = item['metadata'].get('labels', {}).get('cluster.x-k8s.io/cluster-name', '')
        if not (name.startswith(current) or cluster_label == current):
            print(name)
    " 2>/dev/null); do
        DT=$(oc get ${RESOURCE_TYPE} ${CR_NAME} -n {{ capi_namespace }} -o jsonpath='{.metadata.deletionTimestamp}' 2>/dev/null)
        FINALIZERS=$(oc get ${RESOURCE_TYPE} ${CR_NAME} -n {{ capi_namespace }} -o jsonpath='{.metadata.finalizers}' 2>/dev/null)
        if [ -n "$DT" ]; then
          echo "Removing stuck finalizers from ${RESOURCE_TYPE}/${CR_NAME} (deleting since ${DT}, finalizers: ${FINALIZERS})"
          oc patch ${RESOURCE_TYPE} ${CR_NAME} -n {{ capi_namespace }} --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
        else
          echo "Force deleting stale ${RESOURCE_TYPE}/${CR_NAME} (finalizers: ${FINALIZERS})"
          oc delete ${RESOURCE_TYPE} ${CR_NAME} -n {{ capi_namespace }} --timeout=30s 2>/dev/null || true
          oc patch ${RESOURCE_TYPE} ${CR_NAME} -n {{ capi_namespace }} --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
        fi
      done
    done
  register: stale_cr_cleanup
  changed_when: "'Removing' in stale_cr_cleanup.stdout or 'Force deleting' in stale_cr_cleanup.stdout"
  when: "'STALE_CRS_FOUND' in stale_cr_check.stdout"

- name: Display cleanup result
  debug:
    msg: "{{ stale_cr_cleanup.stdout }}"
  when:
    - "'STALE_CRS_FOUND' in stale_cr_check.stdout"
    - stale_cr_cleanup is defined

- name: Wait for stale CRs to be fully removed
  shell: |
    CURRENT_CLUSTER="{{ cluster_name }}"
    REMAINING=0
    for RESOURCE_TYPE in rosacontrolplane rosanetwork rosaroleconfig cluster.cluster.x-k8s.io rosamachinepool machinepool.cluster.x-k8s.io; do
      COUNT=$(oc get ${RESOURCE_TYPE} -n {{ capi_namespace }} -o json 2>/dev/null | python3 -c "
    import sys, json
    data = json.load(sys.stdin)
    current = '${CURRENT_CLUSTER}'
    count = 0
    for item in data.get('items', []):
        name = item['metadata']['name']
        cluster_label = item['metadata'].get('labels', {}).get('cluster.x-k8s.io/cluster-name', '')
        if not (name.startswith(current) or cluster_label == current):
            count += 1
    print(count)
    " 2>/dev/null)
      REMAINING=$((REMAINING + COUNT))
    done
    echo $REMAINING
  register: remaining_crs
  until: remaining_crs.stdout | trim == "0"
  retries: 24
  delay: 5
  when: "'STALE_CRS_FOUND' in stale_cr_check.stdout"

- name: Log stale CR cleanup completion
  shell: |
    LOGDIR="/tmp/capa-resurrection-evidence"
    mkdir -p "$LOGDIR"
    LOGFILE="$LOGDIR/stale-cr-$(date +%Y%m%d-%H%M%S)-cleanup.json"
    python3 -c "
    import json, datetime
    record = {
        'timestamp': datetime.datetime.utcnow().isoformat() + 'Z',
        'event': 'stale_crs_cleaned_pre_provision',
        'target_cluster': '{{ cluster_name }}',
        'namespace': '{{ capi_namespace }}',
        'cleanup_output': '''{{ stale_cr_cleanup.stdout | default('') }}''',
        'aws_orphans': '''{{ aws_orphan_check.stdout | default('NO_AWS_ORPHANS') }}''',
        'cfn_cleanup': '''{{ cfn_cleanup.stdout | default('') }}''',
    }
    print(json.dumps(record, indent=2))
    " > "$LOGFILE"
    echo "Cleanup evidence logged to $LOGFILE"
  changed_when: false
  when: "'STALE_CRS_FOUND' in stale_cr_check.stdout"

- name: Check for OCM cluster name collision
  environment:
    SSL_CERT_FILE: "{{ lookup('pipe', 'python3 -c \"import certifi; print(certifi.where())\"') }}"
  shell: |
    python3 -c "
    import sys, os, json, ssl, urllib.request
    try:
        import certifi
        ctx = ssl.create_default_context(cafile=certifi.where())
    except ImportError:
        ctx = None
    client_id = '{{ OCM_CLIENT_ID | default('') }}'
    client_secret = '{{ OCM_CLIENT_SECRET | default('') }}'
    ocm_api = '{{ OCM_API_URL | default('https://api.stage.openshift.com') }}'.rstrip('/')
    if not client_id or not client_secret:
        print('SKIP_OCM_CHECK')
        sys.exit(0)
    try:
        token_data = 'grant_type=client_credentials&client_id=' + client_id + '&client_secret=' + client_secret
        token_req = urllib.request.Request(
            'https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token',
            data=token_data.encode(),
            headers={'Content-Type': 'application/x-www-form-urlencoded'},
            method='POST'
        )
        with urllib.request.urlopen(token_req, timeout=15, context=ctx) as resp:
            token = json.loads(resp.read())['access_token']
        search_req = urllib.request.Request(
            ocm_api + '/api/clusters_mgmt/v1/clusters?search=name%3D%27{{ cluster_name }}%27',
            headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/json'}
        )
        with urllib.request.urlopen(search_req, timeout=15, context=ctx) as resp:
            clusters = json.loads(resp.read())
        active = [c for c in clusters.get('items', []) if c.get('state') not in ('uninstalling', 'error')]
        if active:
            for c in active:
                print(f'OCM_COLLISION: {c[\"id\"]} state={c[\"state\"]}')
            sys.exit(1)
        uninstalling = [c for c in clusters.get('items', []) if c.get('state') == 'uninstalling']
        if uninstalling:
            for c in uninstalling:
                print(f'OCM_UNINSTALLING: {c[\"id\"]} state={c[\"state\"]}')
            sys.exit(2)
        print('OCM_CLEAN')
    except Exception as e:
        print(f'OCM_CHECK_ERROR: {e}')
        sys.exit(0)
    "
  register: ocm_collision_check
  changed_when: false
  failed_when: false

- name: Fail if active OCM cluster with same name exists
  fail:
    msg: |
      A cluster named '{{ cluster_name }}' already exists in OCM and is active.
      {{ ocm_collision_check.stdout }}
      You must delete or rename before re-provisioning.
  when:
    - ocm_collision_check.rc == 1

- name: Warn if OCM cluster is still uninstalling
  debug:
    msg: |
      ⚠️  A cluster named '{{ cluster_name }}' is still uninstalling in OCM.
      {{ ocm_collision_check.stdout }}
      Provisioning will proceed — the CAPA controller will wait for OCM cleanup.
  when:
    - ocm_collision_check.rc == 2

- name: Check for stale AWS resources matching new cluster name
  environment:
    AWS_ACCESS_KEY_ID: "{{ AWS_ACCESS_KEY_ID | default(omit) }}"
    AWS_SECRET_ACCESS_KEY: "{{ AWS_SECRET_ACCESS_KEY | default(omit) }}"
  shell: |
    REGION="{{ aws_region | default('us-west-2') }}"
    CONFLICTS=""
    STACK_NAME="{{ cluster_name }}-rosa-network-stack"
    STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$REGION" --query 'Stacks[0].StackStatus' --output text 2>&1)
    if [ $? -eq 0 ] && [ "$STATUS" != "DELETE_COMPLETE" ]; then
      CONFLICTS="${CONFLICTS}CloudFormation stack $STACK_NAME exists (status: $STATUS)\n"
      if [ "$STATUS" = "DELETE_FAILED" ]; then
        echo "Cleaning orphaned resources and retrying stack deletion..."
        VPC_ID=$(aws cloudformation describe-stack-resources --stack-name "$STACK_NAME" --region "$REGION" --query "StackResources[?ResourceType=='AWS::EC2::VPC'].PhysicalResourceId" --output text 2>/dev/null)
        if [ -n "$VPC_ID" ] && [ "$VPC_ID" != "None" ]; then
          for SG_ID in $(aws ec2 describe-security-groups --filters "Name=vpc-id,Values=$VPC_ID" --region "$REGION" --query "SecurityGroups[?GroupName!='default'].GroupId" --output text 2>/dev/null); do
            aws ec2 delete-security-group --group-id "$SG_ID" --region "$REGION" 2>/dev/null || true
          done
          for ENI_ID in $(aws ec2 describe-network-interfaces --filters "Name=vpc-id,Values=$VPC_ID" --region "$REGION" --query "NetworkInterfaces[].NetworkInterfaceId" --output text 2>/dev/null); do
            ATTACH_ID=$(aws ec2 describe-network-interfaces --network-interface-ids "$ENI_ID" --region "$REGION" --query "NetworkInterfaces[0].Attachment.AttachmentId" --output text 2>/dev/null)
            if [ -n "$ATTACH_ID" ] && [ "$ATTACH_ID" != "None" ]; then
              aws ec2 detach-network-interface --attachment-id "$ATTACH_ID" --force --region "$REGION" 2>/dev/null || true
              sleep 2
            fi
            aws ec2 delete-network-interface --network-interface-id "$ENI_ID" --region "$REGION" 2>/dev/null || true
          done
          for EP_ID in $(aws ec2 describe-vpc-endpoints --filters "Name=vpc-id,Values=$VPC_ID" --region "$REGION" --query "VpcEndpoints[].VpcEndpointId" --output text 2>/dev/null); do
            aws ec2 delete-vpc-endpoints --vpc-endpoint-ids "$EP_ID" --region "$REGION" 2>/dev/null || true
          done
        fi
        aws cloudformation delete-stack --stack-name "$STACK_NAME" --region "$REGION" 2>/dev/null || true
        echo "Waiting for stack deletion..."
        for i in $(seq 1 30); do
          RECHECK=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$REGION" --query 'Stacks[0].StackStatus' --output text 2>&1)
          if [ $? -ne 0 ] || [ "$RECHECK" = "DELETE_COMPLETE" ]; then
            echo "Stack $STACK_NAME deleted successfully"
            CONFLICTS=""
            break
          fi
          sleep 10
        done
      elif [ "$STATUS" = "DELETE_IN_PROGRESS" ]; then
        echo "Stack $STACK_NAME is DELETE_IN_PROGRESS — waiting..."
        for i in $(seq 1 30); do
          RECHECK=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$REGION" --query 'Stacks[0].StackStatus' --output text 2>&1)
          if [ $? -ne 0 ] || [ "$RECHECK" = "DELETE_COMPLETE" ]; then
            echo "Stack $STACK_NAME deleted successfully"
            CONFLICTS=""
            break
          fi
          sleep 10
        done
      fi
    fi
    if [ -n "$CONFLICTS" ]; then
      echo "AWS_CONFLICTS_FOUND"
      echo -e "$CONFLICTS"
    else
      echo "AWS_CLEAN"
    fi
  register: aws_name_conflict_check
  changed_when: false
  failed_when: false

- name: Fail if unresolvable AWS resource conflicts exist
  fail:
    msg: |
      AWS resources with cluster name '{{ cluster_name }}' still exist and could not be cleaned:
      {{ aws_name_conflict_check.stdout }}
      Resolve these manually or use a different cluster name prefix.
  when:
    - aws_name_conflict_check is defined
    - "'AWS_CONFLICTS_FOUND' in aws_name_conflict_check.stdout"

- name: Confirm namespace is clean
  debug:
    msg: "Namespace {{ capi_namespace }} is clean — no stale CRs. Safe to provision."
  when: "'CLEAN' in stale_cr_check.stdout"

- name: Confirm all pre-provision checks passed
  debug:
    msg: |
      Pre-provision validation complete:
      • K8s namespace: {{ 'Cleaned stale CRs' if 'STALE_CRS_FOUND' in stale_cr_check.stdout else 'Clean' }}
      • OCM cluster name: {{ 'Clean' if ocm_collision_check.rc == 0 else 'Uninstalling (will wait)' }}
      • AWS resources: {{ 'Clean' if (aws_name_conflict_check.stdout | default('AWS_CLEAN')) is search('AWS_CLEAN') else 'Cleaned' }}

# ================================================================
# PRE-STEP: Verify AWS Credentials are Present (if automation enabled)
# ================================================================
- name: Verify AWS credentials are configured
  when: create_rosa_roles | bool or create_rosa_network | bool
  block:
    - name: Check if AWS credentials are provided
      debug:
        msg: |
          🔍 Checking AWS credentials...
          AWS_ACCESS_KEY_ID: {{ 'Set ✓' if AWS_ACCESS_KEY_ID is defined and AWS_ACCESS_KEY_ID != '' else 'Missing ✗' }}
          AWS_SECRET_ACCESS_KEY: {{ 'Set ✓' if AWS_SECRET_ACCESS_KEY is defined and AWS_SECRET_ACCESS_KEY != '' else 'Missing ✗' }}

    - name: Fail if AWS credentials are missing
      fail:
        msg: |
          ❌ AWS Automation Failed: Missing AWS credentials

          RosaRoleConfig and ROSANetwork require valid AWS credentials.

          To use automation features, ensure AWS credentials are configured:
          1. Set environment variables or Ansible extra vars:
             - AWS_ACCESS_KEY_ID
             - AWS_SECRET_ACCESS_KEY
             - AWS_REGION (optional, defaults to us-west-2)

          2. In Jenkins, these should be passed via the Jenkinsfile:
             -e AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID}"
             -e AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY}"

          Note: Credentials will be validated when AWS resources are created.
          If credentials are invalid, you'll see specific AWS API errors.

          Alternatively, disable automation and provide existing infrastructure:
          - Uncheck "Create RosaRoleConfig"
          - Uncheck "Create ROSANetwork"
          - Manually provide AWS IAM roles, OIDC, and VPC/subnets
      when:
        - (AWS_ACCESS_KEY_ID is not defined or AWS_ACCESS_KEY_ID == '') or
          (AWS_SECRET_ACCESS_KEY is not defined or AWS_SECRET_ACCESS_KEY == '')

    - name: Credentials check passed
      debug:
        msg: "✅ AWS credentials are present and will be validated during resource creation"

# ================================================================
# PRE-FLIGHT: Verify OCM role is linked to AWS account
# ================================================================
- name: Verify OCM role is linked to AWS account
  when: create_rosa_roles | bool
  block:
    - name: Display OCM role pre-flight check message
      debug:
        msg: |
          🔍 PRE-FLIGHT: Checking OCM role linkage
          ───────────────────────────────────────────────────────────
          Verifying that an OCM role exists in AWS IAM and is linked
          to the OCM organization. If missing, will auto-create it.

    - name: Run OCM role pre-flight check
      include_tasks: preflight_check_ocm_role.yml

# ================================================================
# STEP 1: Create RosaRoleConfig (if requested)
# ================================================================
- name: Create RosaRoleConfig for automated AWS role creation
  when: create_rosa_roles | bool
  block:
    - name: Display RosaRoleConfig creation message
      debug:
        msg: |

          ⏳ STEP 1/3: Creating RosaRoleConfig
          ───────────────────────────────────────────────────────────
          This will automatically create AWS IAM roles:
          • Installer Role
          • Support Role
          • Worker Role
          • OIDC Provider

    - name: Create RosaRoleConfig resource
      include_tasks: create_rosa_role_config.yml

    - name: Wait for RosaRoleConfig to be ready
      include_tasks: wait_for_rosa_roles.yml
      vars:
        wait_timeout: 600

    - name: RosaRoleConfig creation complete
      debug:
        msg: |
          ✅ STEP 1 COMPLETE: RosaRoleConfig created successfully

          AWS Resources Created:
          • Installer Role ARN: {{ installer_role_arn | default('N/A') }}
          • Support Role ARN: {{ support_role_arn | default('N/A') }}
          • Worker Role ARN: {{ worker_role_arn | default('N/A') }}
          • OIDC Provider ARN: {{ oidc_provider_arn | default('N/A') }}

- name: Skip RosaRoleConfig creation
  when: not (create_rosa_roles | bool)
  debug:
    msg: |

      ⏩ STEP 1/3: Skipping RosaRoleConfig creation
      ───────────────────────────────────────────────────────────
      Using existing AWS roles or manual role configuration.

# ================================================================
# STEP 2: Create ROSANetwork (if requested)
# ================================================================
- name: Create ROSANetwork for automated VPC/subnet creation
  when: create_rosa_network | bool
  block:
    - name: Display ROSANetwork creation message
      debug:
        msg: |

          ⏳ STEP 2/3: Creating ROSANetwork
          ───────────────────────────────────────────────────────────
          This will automatically create AWS network resources:
          • VPC ({{ network_cidr }})
          • Public Subnets ({{ availability_zone_count }} AZ{{ 's' if availability_zone_count | int > 1 else '' }})
          • Private Subnets ({{ availability_zone_count }} AZ{{ 's' if availability_zone_count | int > 1 else '' }})
          • Internet Gateway
          • NAT Gateway{{ 's' if availability_zone_count | int > 1 else '' }}
          • Route Tables

    - name: Create ROSANetwork resource
      include_tasks: create_rosa_network.yml
      vars:
        rosa_network_config_name: "{{ rosa_network_name }}"
        vpc_cidr_block: "{{ network_cidr }}"

    - name: Wait for ROSANetwork to be ready
      include_tasks: wait_for_rosa_network.yml
      vars:
        wait_timeout: 900

    - name: ROSANetwork creation complete
      debug:
        msg: |
          ✅ STEP 2 COMPLETE: ROSANetwork created successfully

          AWS Network Resources Created:
          • VPC ID: {{ vpc_id | default('N/A') }}
          • Public Subnets: {{ public_subnets | length if public_subnets is defined else 0 }}
          • Private Subnets: {{ private_subnets | length if private_subnets is defined else 0 }}
          • CloudFormation Stack: {{ cloudformation_stack | default('N/A') }}

- name: Skip ROSANetwork creation
  when: not (create_rosa_network | bool)
  debug:
    msg: |

      ⏩ STEP 2/3: Skipping ROSANetwork creation
      ───────────────────────────────────────────────────────────
      Using existing VPC/subnets or manual network configuration.

# ================================================================
# STEP 3: Create RosaControlPlane
# ================================================================
- name: Create RosaControlPlane with references to automated resources
  block:
    - name: Display RosaControlPlane creation message
      debug:
        msg: |

          ⏳ STEP 3/3: Creating RosaControlPlane
          ───────────────────────────────────────────────────────────
          Creating ROSA HCP cluster with:
          {% if create_rosa_roles | bool %}
          • RosaRoleConfig reference: {{ rosa_role_config_name }}
          {% endif %}
          {% if create_rosa_network | bool %}
          • ROSANetwork reference: {{ rosa_network_name }}
          {% endif %}

    - name: Determine which template to use
      set_fact:
        cluster_template_name: >-
          {%- if (create_rosa_roles | bool) or (create_rosa_network | bool) -%}
          rosa-controlplane-only
          {%- else -%}
          rosa-control-plane
          {%- endif -%}
        selected_template_category: >-
          {%- if (create_rosa_roles | bool) or (create_rosa_network | bool) -%}
          features
          {%- else -%}
          cluster-configs
          {%- endif -%}

    - name: Display selected template
      debug:
        msg: |
          Selected template: {{ cluster_template_name }}
          Template category: {{ selected_template_category }}
          Template path: templates/versions/{{ openshift_version }}/{{ selected_template_category }}/{{ cluster_template_name }}.yaml.j2

    - name: Build availability zones list from count
      set_fact:
        availability_zones_list: "{{ (availability_zones_list_string | from_yaml) }}"
      vars:
        availability_zones_list_string: >-
          {%- if availability_zone_count | int == 1 -%}
          ['{{ aws_region }}a']
          {%- elif availability_zone_count | int == 2 -%}
          ['{{ aws_region }}a', '{{ aws_region }}b']
          {%- elif availability_zone_count | int == 3 -%}
          ['{{ aws_region }}a', '{{ aws_region }}b', '{{ aws_region }}c']
          {%- else -%}
          ['{{ aws_region }}a']
          {%- endif -%}
      when: create_rosa_network | bool

    - name: Set rosa_network_config for template
      set_fact:
        rosa_network_config:
          identity_name: "default"
          cidr_block: "{{ network_cidr }}"
          availability_zones: "{{ availability_zones_list }}"
      when: create_rosa_network | bool

    - name: Set rosa_role_config for template
      set_fact:
        rosa_role_config:
          identity_name: "default"
          prefix: "{{ rosa_role_prefix }}"
          version: "{{ openshift_version }}"
          enabled: true
      when: create_rosa_roles | bool

    - name: Set cluster network configuration
      set_fact:
        cluster_network:
          machine_cidr: "10.0.0.0/16"
          pod_cidr: "10.128.0.0/14"
          service_cidr: "172.30.0.0/16"

    - name: Set template variables for cluster creation
      set_fact:
        template_vars:
          cluster_name: "{{ cluster_name }}"
          rcp_version: "{{ openshift_version }}"
          rosa_role_config_ref: "{{ rosa_role_config_name if (create_rosa_roles | bool) else omit }}"
          rosa_network_ref: "{{ rosa_network_name if (create_rosa_network | bool) else omit }}"
          create_rosa_roles: "{{ create_rosa_roles | bool }}"
          create_rosa_network: "{{ create_rosa_network | bool }}"

    - name: Create RosaControlPlane from template
      include_tasks: create_rosa_control_plane_versioned.yml
      vars:
        template_name: "{{ cluster_template_name }}"
        template_category: "{{ selected_template_category }}"
        rcp_version: "{{ openshift_version }}"
        apply_immediately: true

    - name: RosaControlPlane creation complete
      debug:
        msg: |
          ✅ STEP 3 COMPLETE: RosaControlPlane created successfully

          Cluster: {{ cluster_name }}
          Namespace: {{ capi_namespace }}
          {% if create_rosa_roles | bool %}
          RosaRoleConfig: {{ rosa_role_config_name }} ✓
          {% endif %}
          {% if create_rosa_network | bool %}
          ROSANetwork: {{ rosa_network_name }} ✓
          {% endif %}

# ================================================================
# STEP 4: Wait for ROSA HCP Cluster to be Ready
# ================================================================
- name: Wait for ROSA HCP cluster provisioning to complete
  block:
    - name: Display cluster readiness wait message
      debug:
        msg: |

          ⏳ STEP 4/4: Waiting for ROSA HCP Cluster to be Ready
          ───────────────────────────────────────────────────────────
          This will wait for the ROSA HCP cluster to fully provision in AWS.

          Cluster: {{ cluster_name }}
          Expected time: 10-20 minutes
          Maximum wait: 37.5 minutes

          Monitoring: oc get rosacontrolplane {{ cluster_name }} -n {{ capi_namespace }} -w

    - name: Wait for ROSAControlPlane to be ready
      include_tasks: wait_for_rosa_control_plane_ready.yml

    - name: Cluster ready confirmation
      debug:
        msg: |
          ✅ STEP 4 COMPLETE: ROSA HCP cluster is READY!

          Cluster: {{ cluster_name }}
          Status: Fully provisioned and running

# ================================================================
# FINAL: Provisioning Complete
# ================================================================
- name: Display final provisioning summary
  debug:
    msg: |

      ✅ ✅ ✅ ROSA HCP CLUSTER PROVISIONING COMPLETE! ✅ ✅ ✅

      Cluster Name: {{ cluster_name }}
      Namespace: {{ capi_namespace }}

      Resources Created:
      {% if create_rosa_roles | bool %}
      ✓ RosaRoleConfig: {{ rosa_role_config_name }}
        ├─ Installer Role
        ├─ Support Role
        ├─ Worker Role
        └─ OIDC Provider
      {% endif %}
      {% if create_rosa_network | bool %}
      ✓ ROSANetwork: {{ rosa_network_name }}
        ├─ VPC: {{ vpc_id | default('N/A') }}
        ├─ Public Subnets: {{ public_subnets | length if public_subnets is defined else 0 }}
        └─ Private Subnets: {{ private_subnets | length if private_subnets is defined else 0 }}
      {% endif %}
      ✓ RosaControlPlane: {{ cluster_name }} (READY ✓)

      Cluster Status: FULLY PROVISIONED AND RUNNING

      Next Steps:
      1. Get cluster console URL: oc get rosacontrolplane {{ cluster_name }} -n {{ capi_namespace }} -o jsonpath='{.status.consoleURL}'
      2. Get kubeconfig: oc get secret {{ cluster_name }}-kubeconfig -n {{ capi_namespace }}
      3. View cluster in ROSA console
      4. Begin testing CAPI workflows

      🚀 Your ROSA HCP cluster is ready to use!
