---
# ================================================================
# Validate mandatory OCM-role linkage for ROSA clusters
# ================================================================
# Jira: ROSA-637 (OCM roles become mandatory for ROSA cluster ops by
#       end of Sept 2026)
# Regression: ROSAENG-60868 (HCP PROD FVT failed — the secondRegularConnection
#       org lacked a linked OCM Role for the prod FVT AWS account, so the OCM
#       API returned 404 where a 403 was expected).
#
# This is the AWS IAM OCM-Role linkage concept (NOT a Kubernetes CR). It runs
# two assertions via a small python validator that reuses OCMClient + AWSClient:
#   1. POSITIVE: with a linked OCM role, an OCM API op is authorized (200).
#   2. NEGATIVE: without linkage the op is rejected — assert 403 but TOLERATE
#      404 during the enforcement-transition window (ROSAENG-60868). A 200 on
#      the negative op means enforcement is not applied = meaningful failure.
#
# Required vars:
#   OCM_CLIENT_ID, OCM_CLIENT_SECRET, OCM_API_URL (default stage),
#   aws_account_id, aws_region
# ================================================================

- name: Display OCM-role linkage validation banner
  debug:
    msg: |
      🔐 VALIDATE: Mandatory OCM-role linkage (ROSA-637 / ROSAENG-60868)
      ───────────────────────────────────────────────────────────
      Positive: linked OCM role -> OCM op authorized (200)
      Negative: unlinked -> rejected (403; 404 tolerated in transition)
      AWS account: {{ aws_account_id | default('(from caller identity)') }}
      OCM API: {{ OCM_API_URL | default('https://api.stage.openshift.com') }}

- name: Run OCM-role linkage validator
  shell: |
    python3 -c "
    import sys, json
    sys.path.insert(0, '{{ playbook_dir }}/..')
    from agents.domains.rosa_hcp.ocm_role_linkage_validator import validate_from_env
    try:
        result = validate_from_env()
        print(json.dumps(result))
    except Exception as e:
        print(json.dumps({'error': str(e)}))
        sys.exit(3)
    "
  register: ocm_linkage_result
  changed_when: false
  failed_when: false
  no_log: true
  environment:
    OCM_CLIENT_ID: "{{ OCM_CLIENT_ID | default('') }}"
    OCM_CLIENT_SECRET: "{{ OCM_CLIENT_SECRET | default('') }}"
    OCM_API_URL: "{{ OCM_API_URL | default('https://api.stage.openshift.com') }}"
    AWS_ACCESS_KEY_ID: "{{ AWS_ACCESS_KEY_ID | default('') }}"
    AWS_SECRET_ACCESS_KEY: "{{ AWS_SECRET_ACCESS_KEY | default('') }}"
    AWS_DEFAULT_REGION: "{{ aws_region | default('us-west-2') }}"
    aws_region: "{{ aws_region | default('us-west-2') }}"
    aws_account_id: "{{ aws_account_id | default('') }}"
    AWS_ACCOUNT_ID: "{{ aws_account_id | default('') }}"
    # Optional endpoint overrides (live-verification residual — see the
    # ocm_role_linkage_validator module docstring). Leave unset to use defaults.
    OCM_LINKAGE_POSITIVE_PATH: "{{ ocm_linkage_positive_path | default('') }}"
    OCM_LINKAGE_NEGATIVE_PATH: "{{ ocm_linkage_negative_path | default('') }}"
    PATH: "{{ AUTOMATION_PATH | default(playbook_dir + '/..') }}/ui/backend/venv/bin:{{ ansible_env.PATH | default('/usr/bin:/bin:/usr/local/bin') }}"

- name: Fail if the validator produced no parseable JSON
  fail:
    msg: |
      ❌ OCM-role linkage validation could not run — the validator produced no
      parseable JSON on stdout. This usually means a Python import/traceback or
      a dependency wrote noise to stdout.

      Ensure OCM_CLIENT_ID/OCM_CLIENT_SECRET and AWS credentials are set, and
      that boto3 is available in the active Python environment.
  # stdout is suppressed (no_log on the shell step) so we do not echo it here,
  # but we still catch the malformed-output case with an actionable message
  # instead of letting `from_json` throw a cryptic masked template error.
  when: (ocm_linkage_result.stdout | default('') | trim) is not match('^\s*\{')

- name: Parse OCM-role linkage result
  set_fact:
    ocm_linkage: "{{ ocm_linkage_result.stdout | from_json }}"

- name: Fail if the validator itself errored
  fail:
    msg: |
      ❌ OCM-role linkage validation could not run.
      {{ ocm_linkage.error | default('validator produced no result') }}

      Ensure OCM_CLIENT_ID/OCM_CLIENT_SECRET and AWS credentials are set, and
      that boto3 is available in the active Python environment.
  when: ocm_linkage.error is defined

- name: Display OCM-role linkage findings
  debug:
    msg: "{{ ocm_linkage.messages | default(['(no messages)']) }}"

- name: Assert IAM OCM-Role exists for the account
  fail:
    msg: |
      ❌ No IAM OCM-Role found for AWS account {{ aws_account_id | default('(unknown)') }}.
      OCM-role linkage is mandatory (ROSA-637) and cannot succeed without it.

      Manual fix: rosa create ocm-role --admin --mode auto --yes
      (or run the create_rosa_role_config / preflight_check_ocm_role flow)
  when: not (ocm_linkage.iam_role_exists | default(false) | bool)

- name: Assert POSITIVE — linked OCM role authorizes the OCM operation
  fail:
    msg: |
      ❌ Positive assertion failed: OCM operation was NOT authorized
      (HTTP {{ ocm_linkage.positive_status_code | default('?') }}) despite an
      IAM OCM-Role being present. Expected 200 with a properly-linked role.
      The OCM role may exist in IAM but not be linked to the organization.
  when: not (ocm_linkage.positive_op_authorized | default(false) | bool)

- name: Assert NEGATIVE — unlinked op rejected with 403 (404 tolerated)
  fail:
    msg: |
      ❌ Negative assertion failed (verdict: {{ ocm_linkage.verdict | default('unknown') }}).
      Unlinked OCM-role operation returned HTTP {{ ocm_linkage.negative_status_code | default('?') }};
      expected 403 (or tolerated 404 during the enforcement transition).

      A 200 here means OCM-role linkage enforcement is NOT applied — this is a
      meaningful ROSA-637 regression. Any other status is unexpected and should
      be triaged (see ROSAENG-60868).
  when: not (ocm_linkage.negative_op_rejected | default(false) | bool)

- name: OCM-role linkage validation PASSED
  debug:
    msg: |
      ✅ OCM-role linkage validation PASSED (ROSA-637 / ROSAENG-60868)
      • IAM OCM-Role exists: {{ ocm_linkage.iam_role_exists }}
      • Linked / positive op authorized: {{ ocm_linkage.positive_op_authorized }}
        (HTTP {{ ocm_linkage.positive_status_code }})
      • Negative op rejected: {{ ocm_linkage.negative_op_rejected }}
        (HTTP {{ ocm_linkage.negative_status_code }}, verdict: {{ ocm_linkage.verdict }})
      {% if not (ocm_linkage.enforcement_applied | default(false) | bool) %}
      ⚠️  NOTE: negative op returned 404, TOLERATED during the enforcement-
          transition window (ROSAENG-60868). Full 403 enforcement not yet live.
      {% endif %}
