- name: Ensure output directory exists
  ansible.builtin.file:
    path: "{{ output_dir }}"
    state: directory
    mode: '0700'

- name: Verify the new hub kubeconfig secret exists on the minikube mgmt cluster
  shell: |
    oc --context {{ minikube_context }} get secret {{ cluster_name }}-kubeconfig -n {{ capi_namespace | default('ns-rosa-hcp') }}
  register: kubeconfig_secret_check
  failed_when: false
  changed_when: false

- name: Fail clearly if the CAPA-published kubeconfig secret is missing
  ansible.builtin.fail:
    msg: |
      ❌ KUBECONFIG SECRET NOT FOUND ❌

      Expected secret '{{ cluster_name }}-kubeconfig' in namespace
      '{{ capi_namespace | default('ns-rosa-hcp') }}' on the minikube management
      cluster (context: {{ minikube_context }}), but it was not found.

      CAPA publishes this secret once the ROSAControlPlane is Ready. Possible causes:
        - The cluster is not fully provisioned yet (wait for ROSAControlPlane Ready).
        - cluster_name / capi_namespace / minikube_context are set incorrectly.

      Verify manually:
        oc --context {{ minikube_context }} get secret {{ cluster_name }}-kubeconfig -n {{ capi_namespace | default('ns-rosa-hcp') }}
        oc --context {{ minikube_context }} get rosacontrolplane {{ cluster_name }} -n {{ capi_namespace | default('ns-rosa-hcp') }}
  when: kubeconfig_secret_check.rc != 0

- name: Extract the new hub kubeconfig from the CAPA-published secret
  shell: |
    oc --context {{ minikube_context }} get secret {{ cluster_name }}-kubeconfig \
      -n {{ capi_namespace | default('ns-rosa-hcp') }} \
      -o jsonpath='{.data.value}' | base64 -d
  register: new_hub_kubeconfig_content
  changed_when: false
  no_log: true

- name: Write the new hub kubeconfig to the output directory
  ansible.builtin.copy:
    content: "{{ new_hub_kubeconfig_content.stdout }}"
    dest: "{{ output_dir }}/{{ cluster_name }}-kubeconfig"
    mode: '0600'
  no_log: true

- name: Register new_hub_kubeconfig fact
  ansible.builtin.set_fact:
    new_hub_kubeconfig: "{{ output_dir }}/{{ cluster_name }}-kubeconfig"

- name: Sanity check - whoami against the new hub
  shell: |
    oc --kubeconfig {{ new_hub_kubeconfig }} whoami
  register: new_hub_whoami
  changed_when: false

- name: Sanity check - clusterversion against the new hub
  shell: |
    oc --kubeconfig {{ new_hub_kubeconfig }} get clusterversion version \
      -o jsonpath='{.status.desired.version}'
  register: new_hub_clusterversion
  changed_when: false

- name: Print new hub connection information
  ansible.builtin.debug:
    msg: |
      ✅ New hub kubeconfig extracted and verified

      Cluster:        {{ cluster_name }}
      Kubeconfig:     {{ new_hub_kubeconfig }}
      whoami:         {{ new_hub_whoami.stdout }}
      ClusterVersion: {{ new_hub_clusterversion.stdout }}
