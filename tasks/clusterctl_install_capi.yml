---
# clusterctl-based CAPI/CAPA Installation
# Installs CAPI providers using the official clusterctl tool

- name: Generate AWS B64 encoded credentials
  shell: |
    clusterawsadm bootstrap credentials encode-as-profile
  register: aws_b64_creds
  environment:
    AWS_REGION: "{{ lookup('env', 'AWS_REGION') | default(AWS_REGION, true) }}"
    AWS_ACCESS_KEY_ID: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') | default(AWS_ACCESS_KEY_ID, true) }}"
    AWS_SECRET_ACCESS_KEY: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') | default(AWS_SECRET_ACCESS_KEY, true) }}"
  no_log: true

- name: Display custom CAPA image information
  when: lookup('env', 'CUSTOM_CAPA_IMAGE') == 'true'
  debug:
    msg:
      - "🎨 Custom CAPA Image Configuration:"
      - "Repository: {{ lookup('env', 'CUSTOM_CAPA_IMAGE_REPO') | trim }}"
      - "Tag: {{ lookup('env', 'CUSTOM_CAPA_IMAGE_TAG') | trim }}"
      - "Will patch CAPA deployment after initialization"

- name: Initialize clusterctl with ROSA support
  shell: |
    clusterctl init --infrastructure aws
  environment:
    KUBECONFIG: "{{ lookup('env', 'KUBECONFIG') | default(lookup('env', 'HOME') + '/.kube/config', true) }}"
    AWS_REGION: "{{ AWS_REGION }}"
    EXP_ROSA: "true"
    EXP_MACHINE_POOL: "true"
    CLUSTER_TOPOLOGY: "true"
    AWS_B64ENCODED_CREDENTIALS: "{{ aws_b64_creds.stdout }}"
  register: clusterctl_init
  failed_when: false

- name: Display clusterctl initialization result
  debug:
    msg: "{{ clusterctl_init.stdout_lines }}"

- name: Wait for CAPI controller manager to be ready
  shell: |
    kubectl wait --for=condition=Available --timeout=300s \
      deployment/capi-controller-manager -n capi-system
  register: capi_ready
  until: capi_ready.rc == 0
  retries: 10
  delay: 30
  failed_when: false

- name: Wait for CAPA controller manager to be ready
  shell: |
    kubectl wait --for=condition=Available --timeout=300s \
      deployment/capa-controller-manager -n capa-system
  register: capa_ready
  until: capa_ready.rc == 0
  retries: 10
  delay: 30
  failed_when: false

# VPN-compatible networking for minikube: pods can't reach 192.168.49.1:53 (bridge DNS)
# or public DNS (8.8.8.8) when VPN is active. Fix: run a socat DNS forwarder on the
# pod-facing node IP (10.244.0.1) and a CONNECT proxy on the VM for HTTPS egress,
# then point CoreDNS and CAPA at them.
- name: Write HTTPS CONNECT proxy script to minikube VM
  shell: |
    minikube ssh -p {{ minikube_context | default(lookup('env', 'MINIKUBE_CONTEXT'), true) }} -- "cat > /tmp/proxy.py << 'PYEOF'
    import socket, threading, select, sys

    def handle(client):
        try:
            req = b''
            while b'\r\n\r\n' not in req:
                req += client.recv(4096)
            line = req.split(b'\r\n')[0].decode()
            method, target, _ = line.split()
            if method == 'CONNECT':
                host, port = target.rsplit(':', 1)
                port = int(port)
                srv = socket.create_connection((host, port), timeout=30)
                client.sendall(b'HTTP/1.1 200 Connection established\r\n\r\n')
                while True:
                    r, _, _ = select.select([client, srv], [], [], 60)
                    if not r: break
                    for s in r:
                        d = s.recv(65536)
                        if not d: return
                        (srv if s is client else client).sendall(d)
        except Exception:
            pass
        finally:
            try: client.close()
            except: pass

    s = socket.socket()
    s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
    s.bind(('0.0.0.0', 3128))
    s.listen(50)
    print('Proxy listening on 0.0.0.0:3128')
    sys.stdout.flush()
    while True:
        c, _ = s.accept()
        threading.Thread(target=handle, args=(c,), daemon=True).start()
    PYEOF"

- name: Start HTTPS proxy and socat DNS forwarder in minikube VM
  shell: |
    CTX="{{ minikube_context | default(lookup('env', 'MINIKUBE_CONTEXT'), true) }}"
    # Kill any stale instances
    minikube ssh -p "$CTX" -- "sudo pkill -f 'python3 /tmp/proxy.py' 2>/dev/null; sudo pkill -f 'socat UDP4-LISTEN:53,bind=10.244.0.1' 2>/dev/null; sleep 1" || true
    # Start HTTPS proxy (runs as docker user since VM user is docker)
    minikube ssh -p "$CTX" -- "nohup python3 /tmp/proxy.py > /tmp/proxy.log 2>&1 &"
    # Start socat DNS forwarder: pod network (10.244.0.1:53) → bridge DNS (192.168.49.1:53)
    minikube ssh -p "$CTX" -- "sudo nohup socat UDP4-LISTEN:53,bind=10.244.0.1,fork,reuseaddr UDP4:192.168.49.1:53 > /tmp/socat-dns.log 2>&1 &"
    sleep 2
  register: vpn_fix_start
  failed_when: false

- name: Update CoreDNS to forward external DNS via pod-facing node IP
  shell: |
    kubectl get configmap coredns -n kube-system -o json | python3 -c "
    import json, sys
    d = json.load(sys.stdin)
    corefile = d['data']['Corefile']
    if 'forward . 10.244.0.1' not in corefile:
        corefile = corefile.replace('forward . /etc/resolv.conf', 'forward . 10.244.0.1')
        d['data']['Corefile'] = corefile
        print(json.dumps(d))
    else:
        print(json.dumps(d))
    " | kubectl apply -f -
    kubectl rollout restart deployment/coredns -n kube-system
    kubectl rollout status deployment/coredns -n kube-system --timeout=60s
  register: coredns_update
  failed_when: false

- name: Patch CAPA controller with HTTPS proxy env vars and ClusterFirst DNS
  shell: |
    kubectl patch deployment capa-controller-manager -n capa-system --type=merge -p '{
      "spec": {
        "template": {
          "spec": {
            "dnsPolicy": "ClusterFirst",
            "dnsConfig": null,
            "containers": [{
              "name": "manager",
              "env": [
                {"name": "HTTPS_PROXY", "value": "http://192.168.49.2:3128"},
                {"name": "HTTP_PROXY",  "value": "http://192.168.49.2:3128"},
                {"name": "NO_PROXY",    "value": "10.96.0.0/12,10.244.0.0/16,192.168.49.0/24,localhost,127.0.0.1,.cluster.local,.svc"}
              ]
            }]
          }
        }
      }
    }'
    kubectl rollout status deployment/capa-controller-manager -n capa-system --timeout=120s
  register: capa_proxy_patch
  failed_when: false

- name: Display VPN networking fix status
  debug:
    msg:
      - "✅ HTTPS CONNECT proxy started in minikube VM (port 3128)"
      - "✅ socat DNS forwarder started on 10.244.0.1:53 → 192.168.49.1:53"
      - "✅ CoreDNS updated to forward . 10.244.0.1"
      - "✅ CAPA patched with HTTPS_PROXY=http://192.168.49.2:3128"
      - "Note: these settings survive pod restarts but not minikube VM reboots"

- name: Apply updated CRDs from CAPA source
  when: lookup('env', 'CUSTOM_CAPA_IMAGE') == 'true' and lookup('env', 'CUSTOM_CAPA_SOURCE_PATH') != ''
  shell: |
    for crd in {{ lookup('env', 'CUSTOM_CAPA_SOURCE_PATH') }}/config/crd/bases/*.yaml; do
      kubectl apply -f "$crd" 2>&1
    done
  register: apply_crds

- name: Display CRD application result
  when: lookup('env', 'CUSTOM_CAPA_IMAGE') == 'true' and lookup('env', 'CUSTOM_CAPA_SOURCE_PATH') != ''
  debug:
    msg:
      - "✅ Updated CRDs applied from CAPA source"
      - "Source: {{ lookup('env', 'CUSTOM_CAPA_SOURCE_PATH') }}/config/crd/bases/"
      - "{{ apply_crds.stdout_lines | default([]) }}"

- name: Create RBAC for NodeadmConfig resources (required by newer CAPA builds)
  when: lookup('env', 'CUSTOM_CAPA_IMAGE') == 'true'
  shell: |
    kubectl apply -f - <<'EOF'
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: nodeadmconfig-access
    rules:
    - apiGroups: ["bootstrap.cluster.x-k8s.io"]
      resources: ["nodeadmconfigs", "nodeadmconfigs/status", "nodeadmconfigtemplates", "nodeadmconfigtemplates/status"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    EOF
  register: nodeadm_role

- name: Bind NodeadmConfig RBAC to CAPA controller service account
  when: lookup('env', 'CUSTOM_CAPA_IMAGE') == 'true'
  shell: |
    kubectl apply -f - <<'EOF'
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: nodeadmconfig-access-binding
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: nodeadmconfig-access
    subjects:
    - kind: ServiceAccount
      name: capa-controller-manager
      namespace: capa-system
    EOF
  register: nodeadm_binding

- name: Display NodeadmConfig RBAC result
  when: lookup('env', 'CUSTOM_CAPA_IMAGE') == 'true'
  debug:
    msg: "✅ NodeadmConfig RBAC configured for CAPA controller"

- name: Patch CAPA controller deployment with custom image
  when: lookup('env', 'CUSTOM_CAPA_IMAGE') == 'true'
  shell: |
    kubectl set image deployment/capa-controller-manager \
      manager={{ lookup('env', 'CUSTOM_CAPA_IMAGE_REPO') | trim }}:{{ lookup('env', 'CUSTOM_CAPA_IMAGE_TAG') | trim }} \
      -n capa-system
  register: patch_capa_image

- name: Display CAPA image patch result
  when: lookup('env', 'CUSTOM_CAPA_IMAGE') == 'true'
  debug:
    msg:
      - "✅ CAPA controller patched with custom image"
      - "Image: {{ lookup('env', 'CUSTOM_CAPA_IMAGE_REPO') | trim }}:{{ lookup('env', 'CUSTOM_CAPA_IMAGE_TAG') | trim }}"

- name: Wait for CAPA controller to restart with new image
  when: lookup('env', 'CUSTOM_CAPA_IMAGE') == 'true'
  shell: |
    kubectl rollout status deployment/capa-controller-manager -n capa-system --timeout=300s
  register: capa_restart
  failed_when: false

- name: Verify CAPA controller is running with custom image
  when: lookup('env', 'CUSTOM_CAPA_IMAGE') == 'true'
  shell: |
    kubectl get deployment capa-controller-manager -n capa-system -o jsonpath='{.spec.template.spec.containers[0].image}'
  register: verify_custom_image

- name: Display verified CAPA image
  when: lookup('env', 'CUSTOM_CAPA_IMAGE') == 'true'
  debug:
    msg: "CAPA controller running with image: {{ verify_custom_image.stdout }}"

- name: Create ns-rosa-hcp namespace
  shell: |
    kubectl create namespace ns-rosa-hcp --dry-run=client -o yaml | kubectl apply -f -
  register: ns_rosa

- name: Create AWS credentials secret in capa-system
  shell: |
    kubectl create secret generic capa-manager-bootstrap-credentials \
      --from-literal=AWS_ACCESS_KEY_ID="{{ lookup('env', 'AWS_ACCESS_KEY_ID') | default(AWS_ACCESS_KEY_ID, true) }}" \
      --from-literal=AWS_SECRET_ACCESS_KEY="{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') | default(AWS_SECRET_ACCESS_KEY, true) }}" \
      --from-literal=AWS_REGION="{{ lookup('env', 'AWS_REGION') | default(AWS_REGION, true) }}" \
      -n capa-system \
      --dry-run=client -o yaml | kubectl apply -f -
  register: aws_secret
  no_log: true

- name: Create ROSA credentials secret in capa-system
  shell: |
    kubectl create secret generic rosa-creds-secret \
      --from-literal=ocmClientID="{{ lookup('env', 'OCM_CLIENT_ID') | default(OCM_CLIENT_ID, true) }}" \
      --from-literal=ocmClientSecret="{{ lookup('env', 'OCM_CLIENT_SECRET') | default(OCM_CLIENT_SECRET, true) }}" \
      --from-literal=ocmApiUrl="https://api.stage.openshift.com" \
      -n capa-system \
      --dry-run=client -o yaml | kubectl apply -f -
  register: rosa_secret_capa
  no_log: true

- name: Create ROSA credentials secret in ns-rosa-hcp
  shell: |
    kubectl create secret generic rosa-creds-secret \
      --from-literal=ocmClientID="{{ lookup('env', 'OCM_CLIENT_ID') | default(OCM_CLIENT_ID, true) }}" \
      --from-literal=ocmClientSecret="{{ lookup('env', 'OCM_CLIENT_SECRET') | default(OCM_CLIENT_SECRET, true) }}" \
      --from-literal=ocmApiUrl="https://api.stage.openshift.com" \
      -n ns-rosa-hcp \
      --dry-run=client -o yaml | kubectl apply -f -
  register: rosa_secret_ns
  no_log: true

- name: Verify CAPI/CAPA installation
  shell: |
    kubectl get deploy -n capi-system
    kubectl get deploy -n capa-system
    kubectl get ns ns-rosa-hcp
  register: verification

- name: Display verification results
  debug:
    msg:
      - "✓ CAPI Core installed via clusterctl"
      - "✓ CAPA (AWS) provider installed via clusterctl"
      - "✓ Namespaces created: capi-system, capa-system, ns-rosa-hcp"
      - "✓ AWS credentials configured"
      - "✓ ROSA credentials configured"
      - ""
      - "Installation method: clusterctl"
