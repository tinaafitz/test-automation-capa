name: PR Checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate PR Title (Semantic)
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            test
            chore
            ci
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            doesn't start with an uppercase character.

      - name: Check PR Size
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            // Fetch files to calculate actual size (not using cached PR metadata)
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });

            // Calculate total changes from actual file data
            const additions = files.data.reduce((sum, file) => sum + file.additions, 0);
            const deletions = files.data.reduce((sum, file) => sum + file.deletions, 0);
            const changes = additions + deletions;

            console.log(`PR changes: ${changes} (additions: ${additions}, deletions: ${deletions})`);
            console.log(`Files changed: ${files.data.length}`);

            // Check if this is a documentation-only PR (or docs + CI files)
            const changedFiles = files.data.map(f => f.filename);
            const docOrCiFiles = changedFiles.filter(f =>
              f.endsWith('.md') ||
              f.match(/^docs\//) ||
              f.match(/^ui\/.*\.md$/) ||
              f.match(/^\.github\/workflows\//)
            );
            const isDocsOnly = docOrCiFiles.length > 0 && docOrCiFiles.length === changedFiles.length;

            // Check if this is a new UI component PR
            const newUiComponents = changedFiles.filter(f =>
              f.match(/^ui\/frontend\/src\/(components|pages)\/.*\.jsx$/)
            );
            const isNewUiComponent = newUiComponents.length > 0 && changes <= 1500;

            // Check if this is a test-only PR (test files + minor supporting changes)
            const testFiles = changedFiles.filter(f =>
              f.match(/test[_\-]/) || f.match(/\.test\./) || f.match(/\/tests?\//)
            );
            const isTestPR = testFiles.length > 0 && testFiles.length >= changedFiles.length * 0.5;

            // Check if this is a feature PR with new UI components, infra, or schema files
            const infraFiles = changedFiles.filter(f =>
              f.match(/^deploy\//) || f.match(/^specs\//) || f.match(/^schemas\//) ||
              f.match(/^agents\//) || f.match(/^playbooks\//) ||
              f.match(/Dockerfile/) || f.match(/Containerfile/) || f.match(/\.dockerignore/) ||
              f.match(/container-run\.sh/) || f.match(/docker-entrypoint\.sh/)
            );
            const isFeaturePR = (newUiComponents.length > 0 || infraFiles.length > 0) && changes <= 5000;

            // Check if this is a refactor PR (code movement: additions ≈ deletions)
            const isRefactorPR = deletions > 0 && additions > 0 &&
              Math.min(additions, deletions) / Math.max(additions, deletions) > 0.5 &&
              changes <= 3000;

            if (isDocsOnly) {
              console.log(`Documentation-only PR - skipping size check (${changes} changes in ${docOrCiFiles.length} doc/ci files)`);
            } else if (isTestPR) {
              core.warning(`Large test PR (${changes} changes in ${testFiles.length} test files). Test PRs are exempt from size limits.`);
            } else if (isNewUiComponent && changes > 1000) {
              core.warning(`Large UI component PR (${changes} changes in ${newUiComponents.length} component files). Allowed up to 1500 for new components.`);
            } else if (isRefactorPR && changes > 1000) {
              core.warning(`Large refactor PR (${changes} changes: +${additions}/-${deletions}). Allowed up to 3000 for balanced refactors.`);
            } else if (isFeaturePR && changes > 1000) {
              core.warning(`Large feature PR (${changes} changes with ${newUiComponents.length} UI components, ${infraFiles.length} infra files). Allowed up to 5000 for feature PRs.`);
            } else if (changes > 1000) {
              core.setFailed(`PR is too large (${changes} changes). Please split into smaller PRs.`);
            } else if (changes > 500) {
              core.warning(`PR is large (${changes} changes). Consider splitting into smaller PRs.`);
            } else {
              console.log(`PR size is acceptable (${changes} changes)`);
            }

      - name: Analyze Changed Files
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });

            const changedFiles = files.data.map(f => f.filename);
            const playbookFiles = changedFiles.filter(f => f.match(/^playbooks\/.*\.ya?ml$/));
            const taskFiles = changedFiles.filter(f => f.match(/^tasks\/.*\.ya?ml$/));
            const testSuiteFiles = changedFiles.filter(f => f.match(/^test-suites\/.*\.json$/));
            const templateFiles = changedFiles.filter(f => f.match(/^templates\/.*\.j2$/));
            const pythonFiles = changedFiles.filter(f => f.endsWith('.py'));

            let comment = '### 📊 Changed Files Analysis\n\n';

            if (playbookFiles.length > 0) {
              comment += `**Playbooks** (${playbookFiles.length}):\n`;
              playbookFiles.forEach(f => comment += `- ${f}\n`);
              comment += '\n';
            }

            if (taskFiles.length > 0) {
              comment += `**Tasks** (${taskFiles.length}):\n`;
              taskFiles.forEach(f => comment += `- ${f}\n`);
              comment += '\n';
            }

            if (testSuiteFiles.length > 0) {
              comment += `**Test Suites** (${testSuiteFiles.length}):\n`;
              testSuiteFiles.forEach(f => comment += `- ${f}\n`);
              comment += '\n';
            }

            if (templateFiles.length > 0) {
              comment += `**Templates** (${templateFiles.length}):\n`;
              templateFiles.forEach(f => comment += `- ${f}\n`);
              comment += '\n';
            }

            if (pythonFiles.length > 0) {
              comment += `**Python Scripts** (${pythonFiles.length}):\n`;
              pythonFiles.forEach(f => comment += `- ${f}\n`);
              comment += '\n';
            }

            // Check for sensitive files
            const sensitiveFiles = changedFiles.filter(f =>
              f.includes('user_vars') ||
              f.includes('credentials') ||
              f.includes('.env')
            );

            if (sensitiveFiles.length > 0) {
              comment += '⚠️ **WARNING: Sensitive files detected!**\n';
              sensitiveFiles.forEach(f => comment += `- ${f}\n`);
              comment += '\nPlease ensure no credentials are committed.\n\n';
            }

            // Post comment (or log if no permissions)
            try {
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number
              });

              const botComment = comments.data.find(c =>
                c.user.type === 'Bot' && c.body.includes('Changed Files Analysis')
              );

              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: comment
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: comment
                });
              }
              console.log('Posted changed files analysis to PR');
            } catch (error) {
              console.log('Unable to post comment (permissions issue), logging analysis instead:');
              console.log(comment);
            }
