# AWS and ROSA credentials — fill in before applying
# Generate base64 values: echo -n "your-value" | base64
apiVersion: v1
kind: Secret
metadata:
  name: capa-automation-credentials
  namespace: capa-automation
  labels:
    app: capa-automation
type: Opaque
data:
  # Required: ROSA token for rosa CLI
  # echo -n "eyJ..." | base64
  ROSA_TOKEN: ""
  # Required: AWS credentials for CloudFormation operations
  # echo -n "AKIA..." | base64
  AWS_ACCESS_KEY_ID: ""
  # echo -n "your-secret-key" | base64
  AWS_SECRET_ACCESS_KEY: ""
  # Optional: AWS region (default: us-east-1)
  # echo -n "us-west-2" | base64
  AWS_DEFAULT_REGION: ""
