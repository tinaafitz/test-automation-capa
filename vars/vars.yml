#==== Common ====
output_dir: "{{ lookup('env', 'HOME') }}/output"
skip_ansible_runner: false
# ansible_async_dir: '/root/.ansible_async'
ansible_async_dir: '/tmp/.ansible_async'

#==== CAPI Installation ====
capi_installation_method: "clusterctl"

#==== Multi-Provider Support ====
cloud_provider: "aws"                            # Default provider: aws, azure
supported_providers: ["aws", "azure"]
provider_config_path: "providers/{{ cloud_provider }}"

#==== Version Management ====
openshift_version: "4.20"                    # Default OpenShift version
supported_versions: ["4.18", "4.19", "4.20", "4.21", "4.22"]
template_version_path: "templates/versions/{{ openshift_version }}"
common_template_path: "templates/common"
schemas_path: "templates/schemas"
feature_matrix_file: "{{ schemas_path }}/feature-matrix.yml"
version_compatibility_file: "{{ schemas_path }}/version-compatibility.yml"

#==== OCP ====
api_url: ""
catalog_sources:
  production:
    app_registry:
      source: "redhat-operators"
    index_image:
      source: ""
  stage:
    app_registry:
      source: "redhat-operators"
    index_image:
      source: "brew.registry.redhat.io/rh-osbs/iib-pub-pending"
  acmd:
    app_registry:
      source: ""
    index_image:
      source: "quay.io:443/acm-d"
  brew:
    app_registry:
      source: ""
    index_image:
      source: "brew.registry.redhat.io/rh-osbs/iib"

#==== ACM/MCE ====
acm_repo: "production"
acm_release_version: ""
acm_sub_name: "advanced-cluster-management"
acm_namespace: "open-cluster-management"

capi_namespace: "ns-rosa-hcp"
rosa_hcp_namespace: "{{ capi_namespace }}"

# Target cluster + minikube mgmt context for install_mce_on_provisioned_cluster.yml.
# Normally supplied via -e cluster_name=... / -e minikube_context=... (or env).
cluster_name: ""
minikube_context: "minikube"
capa_system_namespace: "multicluster-engine"
rosa_creds_secret: "rosa-creds-secret"


mce_sub_name: "multicluster-engine"
mce_namespace: "multicluster-engine"
mce_name: "multiclusterengine"

# Credential defaults ("" so env/user_vars fallbacks in playbooks always resolve;
# preflight_check_mce_creds.yml is what actually hard-fails on empties).
OCM_CLIENT_ID: ""
OCM_CLIENT_SECRET: ""
AWS_ACCESS_KEY_ID: ""
AWS_SECRET_ACCESS_KEY: ""
AWS_REGION: ""

# MCE operator install (used by install_mce_on_provisioned_cluster.yml)
mce_channel: "stable-2.8"                          # must map to MCE >= 2.8; validated against packagemanifest at install time (gaCatalog mode only)
mce_catalog_source: "redhat-operators"
mce_catalog_source_namespace: "openshift-marketplace"
mce_install_plan_approval: "Automatic"

# ---------------------------------------------------------------------------
# MCE source mode: choose between the GA catalog and the acm-d dev catalog.
#
#   gaCatalog  (default) — stable-2.8 / redhat-operators; validated against the
#                          packagemanifest at install time. Standard GA install.
#   devCatalog           — the team's 5.0 pre-release / RC / dev builds, sourced
#                          from the downstream acm-d dev catalog (VERIFIED live
#                          off the ci-azure-w36 regression hub; see docs section 3a).
#
# For a 5.0 RC/dev run, set (per-run, e.g. via -e or user_vars.yml):
#   mce_source_mode: devCatalog
#   acm_repo: acmd                 # -> catalog_sources.acmd.index_image.source = "quay.io:443/acm-d"
#   mce_dev_catalog_tag: latest-5.0   # moving tag, OR pin e.g. "5.0.0-259"
#   mce_channel: stable-5.0        # VERIFIED: acm-d dev catalog publishes per-stream
#                                  #   stable-* channels. stable-5.0 -> v5.0.0-259.
#                                  #   Do NOT use stable-2.8 or candidate-*.
#
# IMPORTANT: the dev catalog's defaultChannel is stable-5.1 (i.e. 5.1). The
# install task ALWAYS sets channel explicitly on the Subscription, so it never
# silently falls back to 5.1 — but that means you MUST set mce_channel for 5.0.
#
# To lock an exact build (recommended for reproducible RC testing), also set
#   mce_starting_csv: multicluster-engine.v5.0.0-259
# The dev catalog HAS a multicluster-engine packagemanifest, so mce_channel is
# validated against it AFTER the CatalogSource reports READY (see task).
#
# PREREQUISITE (hard, live-test): quay.io:443/acm-d is an internal/authenticated
# dev registry. The target ROSA HCP cluster needs a pull secret for
# quay.io:443/acm-d (and possibly an ICSP/IDMS) BEFORE the catalog pod can pull
# the image, otherwise the CatalogSource pod ImagePullBackOffs and never reaches
# READY. See docs/mce-on-provisioned-rosa-hcp.md section 3a.
# ---------------------------------------------------------------------------
mce_source_mode: "gaCatalog"                       # gaCatalog | devCatalog
mce_dev_catalog_name: "mce-dev-catalog"            # CatalogSource metadata.name (devCatalog mode)
mce_dev_catalog_tag: "latest-5.0"                  # moving tag; or pin e.g. "5.0.0-259"
mce_starting_csv: ""                               # optional: pin exact CSV, e.g. "multicluster-engine.v5.0.0-259"
# Derived from the existing catalog_sources / acm_repo scaffolding: setting
# acm_repo: acmd yields "quay.io:443/acm-d/mce-dev-catalog:<tag>". Override
# directly if you need a fully custom image reference.
mce_dev_catalog_image: "{{ catalog_sources[acm_repo].index_image.source }}/mce-dev-catalog:{{ mce_dev_catalog_tag }}"

default_lc_name: "local-cluster"
infra_nodes: false
ingress_cert_secret: "custom-cert"
labeled_resources: []
unannotated_resources: []
acm_resources: ["deployment",
                "configmap",
                "service",
                "serviceaccount",
                "subscription",
                "policy",
                "ValidatingWebhookConfiguration",
                "MutatingWebhookConfiguration",
                "clusterrole",
                "clusterrolebinding",
                "role",
                "rolebinding"]

#==== Upgrade ====
upgraded_to_release_version: ""
eus_upgrade: false
mce_comps_to_be_removed:
mce_comps_to_be_added:
  - name: cluster-api
    status: false
  - name: cluster-api-provider-aws
    status: false
  - name: cluster-api-provider-azure
    status: false
mch_comps_to_be_removed: []
mch_comps_to_be_added:
  - name: multicluster-engine
    status: true

#==== Others ====
operators:
  oadp:
    src: 'redhat-operators'
    channel: ''
    iib_tag: ''


#==== STS ====
oadp_arn: 'arn:aws:iam::902449478968:role/rosa-classic-tn-openshift-oadp-aws-cloud-credentials'

env_var_name: "foo"
env_add_name: "bar"
env_override_name: "baz"

capa_pod_label: "infrastructure-aws"
capi_pod_label: "infrastructure-aws"

#==== ACM-21174 ROSANetwork Configuration ====
acm21174_config:
  # Feature name and description
  feature_name: "ROSANetwork"
  feature_description: "Automated VPC and subnet creation for ROSA HCP clusters"
  test_case: "ACM-21174"

  # Default OpenShift version for ROSANetwork
  openshift_version: "4.20.0"

  # Kind cluster configuration for testing
  kind_cluster_name: "capa-network-test"

  # Feature flags for CAPA controller
  feature_flags:
    EXP_ROSA: "true"
    EXP_MACHINE_POOL: "true"
    CLUSTER_TOPOLOGY: "true"

  # Default network configuration
  default_network_config:
    cidr_block: "10.0.0.0/16"
    availability_zones:
      - "us-west-2a"
      - "us-west-2b"
    tags:
      Environment: "test"
      CreatedBy: "ansible-automation"
      Purpose: "rosanetwork-automation"

  # Testing configuration
  test_config:
    timeout: 1800  # 30 minutes
    enable_cleanup_test: true
    enable_manual_comparison: false
    enable_cluster_creation_test: false

#==== CAPA Controller Network Configuration ====
capa_controller_network:
  # Milan's image with ROSANetwork support
  image: "quay.io/milanvala/cluster-api-provider-aws"
  tag: "milan-rosanetwork-latest"

  # Milan's CRDs repository for ROSANetwork
  milan_crds_base_url: "https://raw.githubusercontent.com/milanvala/cluster-api-provider-aws/rosa-network-crd/config/crd/bases"

#==== ACM-21162 ROSARoleConfig Configuration ====
# Configuration for ROSARoleConfig automated AWS IAM role creation
acm21162:
  enabled: true
  test_case: "ACM-21162"
  description: "ROSARoleConfig automated AWS IAM role creation for ROSA HCP clusters"

  # ROSARoleConfig defaults
  rosa_role_config:
    # Default timeout for role creation (seconds)
    creation_timeout: 1800
    # Default timeout for role validation (seconds)
    validation_timeout: 300
    # Default timeout for cleanup (seconds)
    cleanup_timeout: 600
    # Default polling interval for status checks (seconds)
    poll_interval: 30
    # Enable deletion protection by default
    deletion_protection: false

  # AWS configuration
  aws:
    # Default AWS region for testing
    default_region: "us-east-1"
    # ROSA service account ID for trust policies
    rosa_service_account_id: "710019948333"
    # Default external ID for role assumption
    default_external_id: ""

  # OIDC provider configuration
  oidc_provider:
    # Default OIDC thumbprints for AWS
    default_thumbprints:
      - "9e99a48a9960b14926bb7f3b02e22da2b0ab7280"
      - "a9d53002e97e00e043244f3d170d6f4c414104fd"
    # Default client IDs
    default_client_ids:
      - "sts.amazonaws.com"
    # Test OIDC accessibility during validation
    test_accessibility: false

  # CAPA controller configuration
  capa_controller:
    # Backup deployment before updates
    backup_before_update: true
    # Update ClusterRole with ROSARoleConfig permissions
    update_clusterrole: true
    # Verification timeout (seconds)
    verification_timeout: 300
    # Test controller connectivity
    test_connectivity: false

  # Testing configuration
  testing:
    # Enable manual vs automated comparison tests
    enable_manual_comparison: false
    # Enable full cluster creation tests
    enable_cluster_creation_test: false
    # Enable cleanup tests
    enable_cleanup_test: true
    # Emergency cleanup on critical failures
    emergency_cleanup: false
    # Generate detailed test reports
    generate_reports: true

  # Default tags for AWS resources
  default_tags:
    Environment: "test"
    Project: "ACM-CAPI-Automation"
    TestCase: "ACM-21162"
    CreatedBy: "ansible-automation"

  # Role naming patterns
  role_naming:
    installer_suffix: "-installer-role"
    support_suffix: "-support-role"
    worker_suffix: "-worker-role"

  # Template configuration
  templates:
    # Default template category for ROSARoleConfig
    default_category: "features"
    # Template debug mode
    debug_mode: true
    # Generate static test configurations
    generate_test_configs: true

