<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="CAPA Automation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#EDE9FE"/>
    </linearGradient>
    <!-- rounded-tile clip so nothing pokes past the corners at any size -->
    <clipPath id="tile">
      <rect x="2" y="2" width="60" height="60" rx="14"/>
    </clipPath>
    <!-- soft shadow to lift the gear off the cloud -->
    <filter id="gearShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.1" flood-color="#3B0A66" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- rounded tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>

  <!-- artwork scaled up to fill the tile, clipped to the rounded corners -->
  <g clip-path="url(#tile)">
    <g transform="translate(32 32) scale(1.55) translate(-33 -34)">
      <!-- AWS cloud -->
      <path d="M20 42
               a10 10 0 0 1 1.2-19.9
               a13 13 0 0 1 24.8 3.4
               a8.5 8.5 0 0 1 -1.5 16.5
               Z"
            fill="url(#cloud)"/>

      <!-- automation gear (AWS orange) sitting on the cloud, lifted with a shadow
           and a thin violet ring for separation -->
      <g transform="translate(37.5 37.5)" filter="url(#gearShadow)">
        <path d="M0 -9 l2 0 1 3.2 a9 9 0 0 1 2.7 1.6 l3.1 -1.2 1.4 1.4 -1.2 3.1
                 a9 9 0 0 1 1.6 2.7 l3.2 1 0 2 -3.2 1 a9 9 0 0 1 -1.6 2.7 l1.2 3.1
                 -1.4 1.4 -3.1 -1.2 a9 9 0 0 1 -2.7 1.6 l-1 3.2 -2 0 -1 -3.2
                 a9 9 0 0 1 -2.7 -1.6 l-3.1 1.2 -1.4 -1.4 1.2 -3.1
                 a9 9 0 0 1 -1.6 -2.7 l-3.2 -1 0 -2 3.2 -1 a9 9 0 0 1 1.6 -2.7
                 l-1.2 -3.1 1.4 -1.4 3.1 1.2 a9 9 0 0 1 2.7 -1.6 Z"
              fill="#FF9900" stroke="#EA8600" stroke-width="0.6"/>
        <circle cx="0" cy="0" r="3.6" fill="#6D28D9"/>
      </g>
    </g>
  </g>
</svg>
